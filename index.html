<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <title>GEO3</title>
    <meta name="author" content="Filippe F.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="src/img/geo3_profile.ico">

    <!-- Maplibre -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.6.0/dist/maplibre-gl.css" />

    <!-- Turf -->
    <!-- <script src="src/js/turf.min.js" charset="utf-8"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4/turf.min.js"></script>

     <!-- style -->
    <link rel='stylesheet' href='src/css/style.css'>
    <!-- Elevation, Profile, Feature info tools -->
    <script src='src/js/data_utils.js'></script>
    <!-- Map definitions, layers style -->
    <script src='src/js/map_defs.js'></script>
    <!-- Layer, Profile Controls -->
    <script src='src/js/custom_control.js'></script>
    <!-- Drill core data -->
    <script src='src/js/dc_units_de_by.js'></script>

  </head>
  <body>

    <div id="map"></div>

    <div id="ele_profile_container" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 1000 300" id= "ele_profile_svg">
            <defs>
                <!-- Clip polygon: points set dinamically for each profile-->
                <clipPath id="profile_clip">
                    <polygon id="profile_clip_poly" points="50,25 950,25 950,255 50,255" fill="white"/> 
                </clipPath>
            </defs>
            <!-- Label -->
            <g id= "profile_txt_group" >
                <line id="max_ele_line" x1="50" y1="25" x2="970" y2="25" stroke="#000000" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4,4"/>
                <text id="ele_txt" text-anchor="middle" transform="translate(2,140) rotate(90)" class="ele_profile_label">Elevation (m)</text>
                <text id="dist_txt" text-anchor="middle" x="515" y="298" class="ele_profile_label">Distance (km)</text>
            </g>
            
            <!-- Elevation profile polygon: points set dinamically for each profile -->
            <polygon id="elevation_profile_poly" points="50,25 950,25 950,255 50,255" fill="white" stroke="black" stroke-width="2"/>
            <!-- Drill cores -->
            <!-- All items in clip-group are clipped to Boundary polygon -->
            <g id= "clip-group" clip-path="url(#profile_clip)">
                <line id="cursor_ele_line" x1="20" y1="255" x2="20" y2="20" stroke="#d03030" stroke-width="3"/>
                <g id="dc-profile-groups"></g> <!-- dynamically fill with dcs -->
            </g>

        </svg>
        <!-- Download SVG -->
        <input id="ele_profile_download" type="button" title="Download Profile" value="💾" onclick="download_profile()"></input>
    </div>
    <script type="module">
        // import * as maplibregl from './src/js/maplibre_6-5/dist/maplibre-gl.mjs';
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.6.0/dist/maplibre-gl.mjs';

        //add geojson sources to map style
        map_style.sources["dc_lyr_src"]["data"] = "src/js/dc_de_by.geojson";//TODO: Use relative path to geojson file instead?
        map_style.sources["profile_lyr_src"]["data"] = geojson_profile;
        
        // Initialize the map
        const map = new maplibregl.Map({
            container: 'map', // ID of the HTML element
            pitch: 45,
            minZoom: 4,
            maxZoom: 18,
            maxPitch: 80,
            style: map_style,
            zoom: 9,
            center: [11.5,48.0],
            terrainSkirtLength: 'none'
        });

        // Add default navigation controls (zoom/rotation buttons), scale 
        map.addControl(new maplibregl.ScaleControl({maxWidth: 100, unit: 'metric'}), 'bottom-left'); 
        map.addControl(new maplibregl.GeolocateControl({ }), 'bottom-right');
        map.addControl(new maplibregl.NavigationControl({visualizePitch: true, showZoom: true, showCompass: true}), 'top-right');
        map.addControl(new maplibregl.TerrainControl({ source: 'mapterhorn_terrain_src', exaggeration: v_ex }), 'top-right');
        //add custom controls
        map.addControl(new LayerControl(layer_control_list), 'top-right');
        map.addControl(new ProfileControl(), 'top-right');

        // Create popup
        // Drill core
        const dc_popup = new maplibregl.Popup({
            closeButton: false,
            closeOnClick: false
        });
        // WMS Feature info popup
        const get_info_popup = new maplibregl.Popup({
            closeButton: true,
            closeOnClick: true,
            maxWidth:"350px"
        });

        // Map interaction
        map.on('load', async () => {
            // Hover on  profile line: show cursor position on svg profile
            map.on('mousemove', 'profile-layer', (e) => {
                // map.getCanvas().style.cursor = 'crosshair';
                // console.log("Mousemove event on profile-layer:", e.lngLat);
                if (clickedCoords.length >1) {
                    show_cursor_profile(e.lngLat.lng,e.lngLat.lat)
                }
            });

            // When the mouse leaves the profile layer, return line to left
            map.on('mouseleave', 'profile-layer', () => {
                // map.getCanvas().style.cursor = '';
                let svg_line = document.getElementById("cursor_ele_line");
                svg_line.setAttribute("x1", -1);
                svg_line.setAttribute("x2", -1);
            });
        });

        
        //POPUP DRILL CORES
        map.on('click', 'dc_layer', (e) => {
            e.preventDefault(); //prevent handling general map click
            e._click_handled = true; 
            const feat = e.features[0]
            const coordinates = feat.geometry.coordinates.slice();
            const obj_id = feat.properties["oid"];

            const cur_dc_data = dc_layer_dict[obj_id] ?? {"dc_h":"N/A","max_d":"N/A"};
            const popup_html = `<strong>${obj_id}</strong> <br> 
                          <a>Altitude: ${cur_dc_data["dc_h"]} m </a> <br> 
                          <a>Max Depth: ${cur_dc_data["max_d"]} m</a>`;
            
            dc_popup.setLngLat(coordinates).setHTML(popup_html).addTo(map);

        });
        //  cursor to pointer when entering dc point
        map.on('mouseenter', 'dc_layer', () => {
            if (!document.profile_tool_active) {
                map.getCanvas().style.cursor = 'pointer';
            }
        });
        // Change it back when it leaves.
        map.on('mouseleave', 'dc_layer', () => {
            if (document.profile_tool_active) {
                map.getCanvas().style.cursor = 'crosshair';
            }
            else{
                map.getCanvas().style.cursor = '';
            }
            // dc_popup.remove();
        });
        //TODO: if hover over svg profile, highlight in geojson line profile?
        
        // Profile        
        map.on('click', async (e) => {
            if (e._click_handled) {
                    return; // click handled already for layer click
             }
            //  Drawing profile
            if (document.profile_tool_active == true){
                // Extract [lng, lat] from the click event
                const lngLat = [e.lngLat.lng, e.lngLat.lat];
                if (reset_profile) {
                    clickedCoords = []; // Start new profile
                    profile_cumul_distance = 0;
                    geojson_profile.features[0].geometry.coordinates = []  // Update line
                    geojson_profile.features[1].geometry.coordinates = []; // Update start point
                    geojson_profile.features[2].geometry.coordinates = []; // Update end point
                    map.getSource('profile_lyr_src').setData(geojson_profile);
                    reset_profile = false;
                }

                // console.log(`Click ${clickedCoords.length}:`, lngLat);
                if (clickedCoords.length == 0) {
                    geojson_profile.features[0].geometry.coordinates = [lngLat];   // Update line
                    geojson_profile.features[1].geometry.coordinates = lngLat; // Update start point
                    map.getSource('profile_lyr_src').setData(geojson_profile);
                    clickedCoords.push(lngLat);
                }
                // at least Two points clicked: update the profile line
                else {
                    const last_seg_distance = turf.distance(clickedCoords[clickedCoords.length-1],
                                lngLat,
                                {units:"kilometers"});
                    // same pt? e.eg when double clicking ->ignore
                    if (last_seg_distance<min_segment_distance) return;
                    
                    geojson_profile.features[0].geometry.coordinates.push(lngLat);   // Update line
                    geojson_profile.features[2].geometry.coordinates = lngLat;       // Update end point
                    map.getSource('profile_lyr_src').setData(geojson_profile);
                    // Add last segment distance to cumulative distance
                    profile_cumul_distance+=last_seg_distance;
                    clickedCoords.push(lngLat);

                }

            }
            //  Close poupup/ get Layer info
            else{
                // If popup is open, close it
                if (get_info_popup && get_info_popup.isOpen()) {
                    get_info_popup.remove();
                    return;
                }
                 if (dc_popup && dc_popup.isOpen()) {
                    dc_popup.remove();
                    return;
                }
                // Otherwise check each feature info layer 
                // Min zoom to get feature info?
                let map_z = map.getZoom(); 
                if (map_z<min_zoom_feature_info){
                    return
                }
                // Get Feature info for each layer
                let popup_html =""
                for (let index = 0; index < feature_info_layers.length; index++) {
                    const lyr_def = feature_info_layers[index];
                    // Check layer is not visible
                    const lyr_id = lyr_def["id"];
                    if (map.getLayoutProperty(lyr_id, 'visibility') == 'none'){ //visible
                        continue
                    }
                    // Check within zoom levels for layer
                    if (map_z<lyr_def["minzoom"] || map_z > lyr_def["maxzoom"]){
                        continue
                    }
                    // Check if click is within layer's bbox
                    let bbox = lyr_def["bbox"] ?? [-180, -90, 180, 90];
                    const lng = e.lngLat.lng;
                    const lat = e.lngLat.lat;
                    if (lng<bbox[0] || lng > bbox[2] || lat < bbox[1] || lat > bbox[3]){
                        continue
                    }
                    // Fetch info
                    const feature_info_tbl = await get_feature_info(lng, lat, lyr_def);
                    popup_html += `${feature_info_tbl}`;
                   
                }
                if (popup_html!="") {
                    get_info_popup.setLngLat(e.lngLat).setHTML(popup_html).addTo(map);
                }
            }
        });

        map.on("dblclick", async (e) => {
            if (document.profile_tool_active == true){
                e.preventDefault()
                //Calculate profile
                // Show dialog
                let progress_dialog = document.createElement("dialog");
                progress_dialog.innerHTML = "<p>Calculating Profile...</p>"
                document.body.appendChild(progress_dialog);
                progress_dialog.showModal();
                setTimeout(() => {
                    // Make elevation profile
                    show_elevation_profile(map)
                    // Close dialog
                    progress_dialog.close();           
                    document.body.removeChild(progress_dialog); 
                }, 50)
                reset_profile = true;      
            }
        });


        // map.on('mousemove', (e) => {
            // document.getElementById('info').innerHTML =
            //     // e.point is the x, y coordinates of the mousemove event relative
            //     // to the top-left corner of the map
            //     `${JSON.stringify(e.point)
            //     }<br />${
            //         // e.lngLat is the longitude, latitude geographical position of the event
            //         JSON.stringify(e.lngLat.wrap())}`;
            // });

        // Drop gpx, kml on map
        window.addEventListener("drop", (e) => {
            e.preventDefault();
        });
        const map_container = document.getElementById("map")

        map_container.addEventListener("dragover", (e) => {
            e.preventDefault();
            });

        window.addEventListener("dragover", (e) => {
            e.preventDefault();
        });

        map_container.addEventListener("drop", (e)=> {
            drop_file_handler(e,map);
        });

    
        // load_gpx(map)
    </script>
  </body>
</html>
